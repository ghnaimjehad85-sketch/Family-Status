<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyStatus — اعرف حالة عيلتك بضغطة وحده</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #10070b;
            --bg-card: rgba(34, 17, 25, 0.78);
            --border-glow: rgba(251, 146, 60, 0.32);
            --sunset-orange: #f97316;
            --sunset-amber: #fbbf24;
            --rose-glow: #ec4899;
            --text-primary: #fff5f7;
            --text-soft: #dfc2ce;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100%;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        body {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 22px 24px 36px;
            background:
                radial-gradient(ellipse 75% 55% at 85% 12%, rgba(249, 115, 22, 0.28), transparent 60%),
                radial-gradient(ellipse 65% 55% at 15% 88%, rgba(236, 72, 153, 0.24), transparent 62%),
                radial-gradient(circle at 50% 45%, rgba(251, 191, 36, 0.08), transparent 55%),
                linear-gradient(160deg, #0e0609 0%, #1d0e15 52%, #0d0508 100%);
        }

        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(85px);
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 9s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 340px;
            height: 340px;
            top: -80px;
            right: -70px;
            background: rgba(249, 115, 22, 0.24);
        }

        .orb-2 {
            width: 380px;
            height: 380px;
            bottom: -110px;
            left: -80px;
            background: rgba(236, 72, 153, 0.22);
            animation-delay: -4s;
        }

        @keyframes floatOrb {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(22px) scale(1.06); }
        }

        .site-header {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 12px 18px;
            border-radius: 18px;
            background: rgba(27, 13, 20, 0.72);
            border: 1px solid rgba(251, 146, 60, 0.22);
            backdrop-filter: blur(14px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffedd5;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: -0.2px;
        }

        .brand-mark {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: grid;
            place-items: center;
            font-size: 19px;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.28), rgba(236, 72, 153, 0.28));
            border: 1px solid rgba(251, 146, 60, 0.45);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-btn {
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 10px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, filter 0.18s ease;
            white-space: nowrap;
        }

        .top-btn:hover {
            transform: translateY(-2px);
        }

        .top-btn-login {
            color: #fff5f7;
            background: rgba(20, 10, 15, 0.9);
            border: 1px solid rgba(251, 146, 60, 0.45);
        }

        .top-btn-login:hover {
            border-color: #f472b6;
            box-shadow: 0 6px 18px rgba(236, 72, 153, 0.2);
        }

        .top-btn-signup {
            color: #ffffff;
            background: linear-gradient(135deg, var(--sunset-orange), var(--rose-glow));
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.35);
        }

        .top-btn-signup:hover {
            filter: brightness(1.08);
            box-shadow: 0 10px 26px rgba(236, 72, 153, 0.42);
        }

        .hero-stage {
            position: relative;
            z-index: 2;
            flex: 1;
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 42px 12px 18px;
            gap: 34px;
        }

        .hero-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 800;
            color: #fed7aa;
            background: rgba(249, 115, 22, 0.14);
            border: 1px solid rgba(251, 146, 60, 0.34);
            box-shadow: inset 0 0 16px rgba(251, 146, 60, 0.08);
        }

        .hero-title {
            font-size: clamp(38px, 7.2vw, 76px);
            font-weight: 900;
            line-height: 1.22;
            max-width: 920px;
            color: #fff7ed;
            text-shadow: 0 14px 42px rgba(0, 0, 0, 0.55);
            animation: titleReveal 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .hero-title .highlight {
            display: inline-block;
            background: linear-gradient(125deg, #fb923c 0%, #fbbf24 45%, #f472b6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 6px 24px rgba(249, 115, 22, 0.28));
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .preview-showcase {
            width: 100%;
            max-width: 660px;
            padding: 20px;
            border-radius: 26px;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(18px);
            box-shadow:
                0 24px 64px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: cardReveal 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
        }

        @keyframes cardReveal {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .preview-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(251, 146, 60, 0.16);
        }

        .preview-room-name {
            font-size: 15px;
            font-weight: 800;
            color: #fed7aa;
        }

        .preview-live-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #86efac;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.28);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .preview-rows {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .member-chip {
            background: rgba(17, 8, 13, 0.78);
            border: 1px solid rgba(251, 146, 60, 0.18);
            border-radius: 16px;
            padding: 13px 12px;
            text-align: right;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .member-chip:hover {
            transform: translateY(-2px);
            border-color: rgba(244, 114, 182, 0.45);
        }

        .member-who {
            font-size: 14px;
            font-weight: 800;
            color: #fff5f7;
            margin-bottom: 6px;
        }

        .member-state {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            color: #ffedd5;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.25), rgba(236, 72, 153, 0.22));
            border: 1px solid rgba(251, 146, 60, 0.32);
        }

        @media (max-width: 680px) {
            body {
                padding: 16px 14px 28px;
            }

            .site-header {
                padding: 10px 12px;
                border-radius: 15px;
            }

            .brand {
                font-size: 17px;
                gap: 8px;
            }

            .brand-mark {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .top-btn {
                font-size: 12px;
                padding: 7px 12px;
            }

            .preview-rows {
                grid-template-columns: 1fr;
            }

            .member-chip {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 14px;
            }

            .member-who {
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-orb orb-1" aria-hidden="true"></div>
    <div class="ambient-orb orb-2" aria-hidden="true"></div>

    <header class="site-header">
        <a href="index.html" class="brand">
            <span class="brand-mark">🌅</span>
            <span>FamilyStatus</span>
        </a>

        <nav class="header-actions" aria-label="الدخول والحساب">
            <a href="login.html" class="top-btn top-btn-login">تسجيل الدخول</a>
            <a href="signup.html" class="top-btn top-btn-signup">إنشاء حساب</a>
        </nav>
    </header>

    <main class="hero-stage">
        <div class="hero-pill">✦ لحظة بلحظة مع العائلة</div>

        <h1 class="hero-title">
            اعرف حالة عيلتك <span class="highlight">بضغطة وحده</span>
        </h1>

        <section class="preview-showcase" aria-label="معاينة سريعة لحالة العائلة">
            <div class="preview-top">
                <span class="preview-room-name">🏡 بيت العائلة</span>
                <span class="preview-live-tag">
                    <span class="live-dot"></span>
                    مباشر
                </span>
            </div>

            <div class="preview-rows">
                <div class="member-chip">
                    <div class="member-who">الوالد</div>
                    <span class="member-state">🟢 متاح</span>
                </div>
                <div class="member-chip">
                    <div class="member-who">الوالدة</div>
                    <span class="member-state">🚗 في الطريق</span>
                </div>
                <div class="member-chip">
                    <div class="member-who">الأخ</div>
                    <span class="member-state">💼 في اجتماع</span>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { auth } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.replace("my-communities.html");
            }
        });
    </script>
    <script type="module" src="thanks.js"></script>
</body>
</html>
