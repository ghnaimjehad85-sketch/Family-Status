
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء مجتمع | FamilyStatus</title>
    <link rel="stylesheet" href="auth.css">

    <style>
        .create-community-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 25px;
            text-align: right;
        }

        .create-community-form label {
            font-weight: bold;
            margin-bottom: -10px;
        }

        .create-community-form input,
        .create-community-form textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(180,100,255,.3);
            border-radius: 12px;
            background: rgba(255,255,255,.05);
            color: inherit;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .create-community-form textarea {
            resize: vertical;
            min-height: 120px;
        }

        .create-community-form input:focus,
        .create-community-form textarea:focus {
            border-color: #9333ea;
        }

        .create-community-form button {
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #9333ea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            color: inherit;
            text-decoration: none;
            opacity: .8;
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">✦</div>
                <span>FamilyStatus</span>
            </div>

            <h1>إنشاء مجتمع عائلتك 🏠</h1>

            <p class="subtitle">
                أنشئ مجتمعك الخاص واجمع أفراد عائلتك في مكان واحد.
            </p>

            <form class="create-community-form" id="communityForm">

                <label for="communityName">اسم المجتمع</label>
                <input
                    type="text"
                    id="communityName"
                    placeholder="مثلاً: عائلة الغنيم"
                    required
                    maxlength="60"
                >

                <label for="communityDescription">وصف المجتمع</label>
                <textarea
                    id="communityDescription"
                    placeholder="اكتب نبذة عن مجتمع عائلتك..."
                    maxlength="500"
                ></textarea>

                <button type="submit">
                    إنشاء المجتمع
                </button>

            </form>

            <a href="community.html" class="back-button">
                ← العودة
            </a>

        </section>

        <div class="footer-note">
            <span>✦</span>
            مكان يجمع العائلة
        </div>

    </main>
    <script type="module" src="community.js"></script>
    <script type="module" src="thanks.js"></script>
</body>
</html>
