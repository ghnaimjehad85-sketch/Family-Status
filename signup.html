<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | FamilyStatus</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-wrapper" style="max-width:470px;">
        <section class="auth-card">
            <div class="auth-brand">
                <span>🌅</span>
                <span>FamilyStatus</span>
            </div>
            <p class="auth-subtitle">أنشئ حسابك العائلي في أقل من دقيقة</p>

            <form id="signupForm">
                <div class="name-row">
                    <div class="input-group">
                        <label for="firstName">الاسم الأول</label>
                        <input type="text" id="firstName" placeholder="جهاد" required>
                    </div>

                    <div class="input-group">
                        <label for="lastName">اسم العائلة</label>
                        <input type="text" id="lastName" placeholder="غنايم" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="username">اسم المستخدم (اليوزر)</label>
                    <input type="text" id="username" placeholder="jehad_85" required>
                </div>

                <div class="input-group">
                    <label for="age">العمر</label>
                    <input type="number" id="age" min="6" max="120" placeholder="20" required>
                </div>

                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@gmail.com" autocomplete="email" required>
                </div>

                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="6 أحرف على الأقل" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn-primary" id="signupButton">
                    إنشاء الحساب
                </button>
            </form>

            <p id="signupMessage" class="auth-message"></p>

            <div class="auth-footer">
                لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
            </div>
        </section>
    </main>

    <script type="module" src="signup.js"></script>
    <script type="module" src="thanks.js"></script>
</body>
</html>
